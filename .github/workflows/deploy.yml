name: Build and Deploy to GitHub Pages
on:
  push:
    branches: ["main"] 
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Platform
        run: uname -a
      - name: install nix from https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.3/nix-installer.sh
        run: cat nix-installer.sh | sh -s -- install --no-confirm
      - name: nix version
        run: nix --version
      - name: Build Project
        run: |
          nix build github:nix-ontouchstart/nix-ontouchstart-ai-generated-nix-rust-wasm-playground/x86_64-linux
          ls -l result
          ls result
          cp result/* .
          rm -rf result
      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
